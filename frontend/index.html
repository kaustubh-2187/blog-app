<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Writing Agent</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1>🌟 Blog Writer</h1>
            
            <!-- Generation Form -->
            <div class="form-section">
                <h2>Generate New Blog</h2>
                <form id="blogForm">
                    <label for="topic">Topic</label>
                    <textarea id="topic" rows="4" required placeholder="Enter your blog topic..."></textarea>
                    
                    <label for="asOf">As-of date</label>
                    <input type="date" id="asOf" required>
                    
                    <button type="submit" id="generateBtn">🚀 Generate Blog</button>
                </form>
            </div>

            <!-- Past Blogs -->
            <div class="past-section">
                <h2>Past Blogs</h2>
                <div id="pastBlogsList">Loading...</div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Welcome Screen -->
            <div id="welcomeScreen" class="screen active">
                <div class="welcome">
                    <h1>Welcome to Blog Writing Agent</h1>
                    <p>Enter a topic in the sidebar and click "Generate Blog" to create your AI-powered blog post.</p>
                </div>
            </div>

            <!-- Loading Screen -->
            <div id="loadingScreen" class="screen">
                <div class="loading">
                    <div class="spinner"></div>
                    <h2>Generating Your Blog</h2>
                    <p id="loadingMessage">Starting generation...</p>
                    <div id="progressInfo"></div>
                </div>
            </div>

            <!-- Results Screen -->
            <div id="resultsScreen" class="screen">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" data-tab="plan">📋 Plan</button>
                    <button class="tab" data-tab="preview">📝 Preview</button>
                    <button class="tab" data-tab="images">🖼️ Images</button>
                    <button class="tab" data-tab="logs">📊 Logs</button>
                </div>

                <!-- Tab Content -->
                <div class="tab-content">
                    <!-- Plan Tab -->
                    <div id="planTab" class="tab-pane active">
                        <h2>Blog Plan</h2>
                        <div id="planContent"></div>
                    </div>

                    <!-- Preview Tab -->
                    <div id="previewTab" class="tab-pane">
                        <div class="preview-header">
                            <h2>Preview</h2>
                            <button id="downloadBtn" class="btn-download">⬇️ Download Markdown</button>
                        </div>
                        <div id="previewContent"></div>
                    </div>

                    <!-- Images Tab -->
                    <div id="imagesTab" class="tab-pane">
                        <h2>Generated Images</h2>
                        <div id="imagesContent"></div>
                    </div>

                    <!-- Logs Tab -->
                    <div id="logsTab" class="tab-pane">
                        <h2>Execution Logs</h2>
                        <textarea id="logsContent" readonly></textarea>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="/static/app.js"></script>
</body>
</html>
